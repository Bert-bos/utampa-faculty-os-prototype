                calendarPhaseRequest += 1;
                const requestInPhase = calendarPhaseRequest;
                const future = hours => new Date(Date.now() + hours * 60 * 60 * 1000).toISOString();
                let title = calendarPhase === 'service-initial' ? 'Spartan Incubator initial result' : 'Header event';
                let delay = 0;
                if (calendarPhase === 'panel-initial') title = 'Initial panel result';
                if (calendarPhase === 'panel-refresh') {
                  title = requestInPhase === 1 ? 'Older panel refresh result' : 'Newest panel refresh result';
                  delay = requestInPhase === 1 ? 250 : 10;
                }
                if (calendarPhase === 'service-refresh') {
                  title = requestInPhase === 1 ? 'Spartan Incubator older refresh result' : 'Spartan Incubator newest refresh result';
                  delay = requestInPhase === 1 ? 250 : 10;
                }
                if (calendarPhase === 'search') title = requestInPhase === 1 ? 'Old search calendar title' : 'New search calendar title';
                if (delay) await new Promise(resolve => setTimeout(resolve, delay));
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ events: [{ id: calendarPhase + '-' + requestInPhase, title, start: future(2), end: future(3), calendar: 'Authorized test feed', allDay: false }], source: 'Google Calendar · read-only out-of-order fixture', partial: false, truncated: false, warnings: [] }) });
              });
              await staleGuard.route('**/api/drive**', async route => {
                const query = new URL(route.request().url()).searchParams.get('q') || '';
                const old = /^Old/i.test(query);
                if (old) await new Promise(resolve => setTimeout(resolve, 250));
                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ files: [{ id: old ? 'old-file' : 'new-file', name: old ? 'Old stale filename' : 'New current filename', mimeType: 'text/plain', modifiedTime: new Date().toISOString() }], source: 'Google Drive metadata · read-only out-of-order fixture', truncated: false }) });
