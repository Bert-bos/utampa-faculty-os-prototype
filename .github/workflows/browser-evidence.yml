              assert(!/Older panel refresh result/.test(await staleGuard.locator('.ut-calendar-content').innerText()), 'older Calendar refresh cannot overwrite the newest result');

              calendarPhase = 'service-initial'; calendarPhaseRequest = 0;
              await staleGuard.locator('.sectionTabs button', { hasText: 'Service' }).click();
              await staleGuard.waitForFunction(() => document.body.innerText.includes('Spartan Incubator initial result'));
              calendarPhase = 'service-refresh'; calendarPhaseRequest = 0;
              await staleGuard.locator('.ut-service-refresh').click();
              await staleGuard.locator('.ut-service-refresh').click();
              await staleGuard.waitForFunction(() => document.body.innerText.includes('Spartan Incubator newest refresh result'));
              await staleGuard.waitForTimeout(300);
              assert(!/Spartan Incubator older refresh result/.test(await staleGuard.locator('.ut-service-schedule-body').innerText()), 'older Service refresh cannot overwrite the newest result');

              await staleGuard.locator('.ut-source-status .ut-mobile-search').click();
              calendarPhase = 'search'; calendarPhaseRequest = 0;
              await staleGuard.locator('#ut-search-input').fill('Old');
              await staleGuard.locator('.ut-search-form button').click();
              await staleGuard.locator('#ut-search-input').fill('New');
              await staleGuard.locator('.ut-search-form button').click();
              await staleGuard.waitForFunction(() => document.body.innerText.includes('New current filename'));
              await staleGuard.waitForTimeout(300);
              const newestSearchText = await staleGuard.locator('.ut-search-results').innerText();
              assert(/New current filename/.test(newestSearchText) && !/Old stale filename/.test(newestSearchText), 'older Search response cannot overwrite the newest result');
