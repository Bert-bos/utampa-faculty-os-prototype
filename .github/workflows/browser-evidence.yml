                await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ files: [{ id: old ? 'old-file' : 'new-file', name: old ? 'Old stale filename' : 'New current filename', mimeType: 'text/plain', modifiedTime: new Date().toISOString() }], source: 'Google Drive metadata · read-only out-of-order fixture', truncated: false }) });
