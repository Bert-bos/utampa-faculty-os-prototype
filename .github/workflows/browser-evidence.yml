name: UTampa exact-head browser evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
      PORT: 4175
      GOOGLE_CLIENT_ID: synthetic-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: synthetic-evidence-client-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:4175/auth/google/callback
      UTAMPA_ALLOWED_EMAIL: bert@bertseither.com
      UTAMPA_SESSION_SECRET: synthetic-evidence-session-secret-32-chars
      UTAMPA_SYNTHETIC_OIDC: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify exact checkout and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node server.js >utampa.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/healthz >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat utampa.log
          exit 1

      - name: Capture synthetic exact-head browser states
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p evidence
          cat > evidence.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const base = 'http://127.0.0.1:4175';
          const evidence = { exactHead: process.env.RC_SHA, identity: 'injected synthetic Google OIDC for bert@bertseither.com; no real account or token', data: 'committed prototype interface plus browser-routed synthetic Calendar/Drive metadata fixtures; no external private/protected source or real account was queried', screenshots: [], checks: {}, failures: [] };
          const assert = (ok, message) => { if (!ok) evidence.failures.push(message); };
          async function shot(page, name, authState) {
            await page.screenshot({ path: 'evidence/' + name + '.png', fullPage: true });
            evidence.screenshots.push(name + '.png');
            const geometry = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth }));
            evidence.checks[name] = { authState, url: page.url(), title: await page.title(), text: (await page.locator('body').innerText()).slice(0, 1800), geometry };
            return evidence.checks[name];
          }
          async function keyboardFocusEvidence(page, selector, maxTabs = 40) {
            await page.evaluate(() => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
            for (let index = 0; index < maxTabs; index += 1) {
              await page.keyboard.press('Tab');
              const result = await page.evaluate(target => {
                const active = document.activeElement;
                if (!active || !active.matches(target)) return null;
                const style = getComputedStyle(active);
                return { reached: true, tag: active.tagName, text: (active.textContent || '').trim(), outlineStyle: style.outlineStyle, outlineWidth: style.outlineWidth, outlineColor: style.outlineColor };
              }, selector);
              if (result) return result;
            }
            return { reached: false };
          }
          async function login(page, next = '/') {
            await page.goto(base + '/login?next=' + encodeURIComponent(next), { waitUntil: 'domcontentloaded' });
            await Promise.all([page.waitForURL(base + next), page.locator('[data-testid=google-sign-in]').click()]);
            await page.waitForSelector('[data-cc-workspace="bos"][aria-disabled="true"]');
            await page.waitForTimeout(250);
            assert(await page.locator('input[type=password]').count() === 0, 'no local password field');
            const me = await page.evaluate(async () => { const response = await fetch('/api/me'); return { status: response.status, body: await response.json() }; });
            assert(me.status === 200 && me.body.email === 'bert@bertseither.com', 'authenticated identity is the owner-approved personal Google account');
          }
          async function routeAuthorizedSources(page, options = {}) {
            const future = hours => new Date(Date.now() + hours * 60 * 60 * 1000).toISOString();
            const events = options.events === undefined ? [{ id: 'event-1', title: 'ENT 330 · Venture Validation', start: future(2), end: future(3), location: 'Sykes 134', calendar: 'Personal test calendar', url: 'https://calendar.google.com/calendar/event?eid=synthetic', allDay: false }] : options.events;
            const files = options.files === undefined ? [{ id: 'file-1', name: 'ENT 330 Venture Validation Deck', mimeType: 'application/vnd.google-apps.presentation', modifiedTime: '2026-09-22T15:00:00Z', url: 'https://drive.google.com/open?id=synthetic' }] : options.files;
            const calendarStatus = options.calendarStatus || 200;
            const calendarBody = calendarStatus === 409 ? { error: 'reauthorization_required' } : calendarStatus >= 400 ? { error: 'calendar_unavailable' } : { events, source: 'Google Calendar · read-only test fixture', partial: Boolean(options.partial), truncated: Boolean(options.truncated), warnings: options.partial ? [{ code: 'calendar_unavailable', calendar: 'Synthetic unavailable source' }] : [] };
            const driveStatus = options.driveStatus || 200;
            const driveBody = driveStatus === 409 ? { error: 'reauthorization_required' } : driveStatus >= 400 ? { error: 'drive_unavailable' } : { files, source: 'Google Drive metadata (read-only test fixture)', truncated: Boolean(options.driveTruncated) };
            await page.route('**/api/calendar', route => route.fulfill({ status: calendarStatus, contentType: 'application/json', body: JSON.stringify(calendarBody) }));
            await page.route('**/api/drive**', route => route.fulfill({ status: driveStatus, contentType: 'application/json', body: JSON.stringify(driveBody) }));
          }
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            evidence.runtime = { node: process.version, playwright: require('playwright/package.json').version, browser: await browser.version() };
            const diagnostics = [];
            async function newPage(options) {
              const page = await browser.newPage(options);
              page.on('pageerror', error => diagnostics.push('pageerror: ' + String(error)));
              page.on('console', message => { if (message.type() === 'error' && !/^Failed to load resource: the server responded with a status of \d+/.test(message.text())) diagnostics.push('console: ' + message.text()); });
              page.on('requestfailed', request => { if (!/ERR_ABORTED/.test(request.failure()?.errorText || '')) diagnostics.push('requestfailed: ' + request.url() + ' · ' + (request.failure()?.errorText || 'unknown')); });
              page.on('response', response => {
                const target = new URL(response.url());
                if (target.origin !== base || response.status() < 400) return;
                if (target.pathname === '/boss/' || target.pathname === '/api/calendar' || target.pathname === '/api/drive') return;
                diagnostics.push('http ' + response.status() + ': ' + response.url());
              });
              return page;
            }
            try {
              for (const [name, width, height] of [['01-login-desktop-1440',1440,1000],['02-login-mobile-390',390,844],['03-login-mobile-375',375,812],['03b-login-mobile-320',320,568]]) {
                const page = await newPage({ viewport: { width, height } });
                await page.goto(base + '/login', { waitUntil: 'domcontentloaded' });
                const state = await shot(page, name, 'unauthenticated-entry');
                assert(/continue with google/i.test(state.text), name + ' Google identity entry');
                assert(/^My Work Login/m.test(state.text), name + ' neutral login label');
                assert(!/University of Tampa|Faculty OS/i.test(state.text), name + ' no University branding');
                assert(/read-only Calendar event metadata and Drive filename metadata visible to this personal Google account/i.test(state.text), name + ' pre-consent personal metadata disclosure');
                assert(/University accounts, Canvas, Workday, student records, and institutional systems are not connected/i.test(state.text), name + ' pre-consent institutional boundary');
                assert(state.geometry.scrollWidth <= state.geometry.clientWidth, name + ' overflow');
                const buttonHeight = await page.locator('[data-testid=google-sign-in]').evaluate(node => node.getBoundingClientRect().height);
                assert(buttonHeight >= 44, name + ' touch target');
                const focusEvidence = await keyboardFocusEvidence(page, '[data-testid=google-sign-in]');
                state.googleKeyboardFocus = focusEvidence;
                assert(focusEvidence.reached && focusEvidence.outlineStyle !== 'none' && parseFloat(focusEvidence.outlineWidth) >= 3, name + ' visible Google keyboard focus');
                if (name === '02-login-mobile-390') {
                  await page.screenshot({ path: 'evidence/14-login-keyboard-focus-mobile-390.png', fullPage: true });
                  evidence.screenshots.push('14-login-keyboard-focus-mobile-390.png');
                }
                await page.evaluate(() => document.querySelector('[data-testid=google-sign-in]').addEventListener('click', event => event.preventDefault(), { capture: true, once: true }));
                await page.locator('[data-testid=google-sign-in]').click();
                const loadingEvidence = await page.locator('#auth-status').evaluate(node => ({ text: node.textContent, role: node.getAttribute('role'), live: node.getAttribute('aria-live'), atomic: node.getAttribute('aria-atomic') }));
                state.assistiveLoading = loadingEvidence;
                assert(/opening google sign-in/i.test(loadingEvidence.text || '') && loadingEvidence.role === 'status' && loadingEvidence.live === 'polite' && loadingEvidence.atomic === 'true', name + ' assistive loading announcement');
                await page.close();
              }

              const error = await newPage({ viewport: { width: 390, height: 844 } });
              await error.goto(base + '/login?error=sign-in');
              await error.waitForSelector('[role=alert]');
              const errorState = await shot(error, '04-oauth-error-mobile-390', 'oauth-error-local-only');
              assert(/could not complete sign-in/i.test(errorState.text), 'safe OAuth error message');
              assert(await error.locator('[role=alert]').evaluate(node => document.activeElement === node), 'error focus');
              const errorAnnouncement = await error.locator('[role=alert]').evaluate(node => ({ role: node.getAttribute('role'), live: node.getAttribute('aria-live'), atomic: node.getAttribute('aria-atomic'), focused: document.activeElement === node }));
              errorState.assistiveError = errorAnnouncement;
              assert(errorAnnouncement.role === 'alert' && errorAnnouncement.live === 'assertive' && errorAnnouncement.atomic === 'true' && errorAnnouncement.focused, 'assistive OAuth error announcement and focus return');
              assert(errorState.geometry.scrollWidth <= errorState.geometry.clientWidth, 'error overflow');
              await error.close();

              const denied = await newPage({ viewport: { width: 390, height: 844 } });
              await denied.goto(base + '/service/spartan-incubator', { waitUntil: 'domcontentloaded' });
              const deniedState = await shot(denied, '05-unauthenticated-deep-link-denied', 'unauthenticated-denied');
              assert(/\/login\?next=/.test(deniedState.url), 'unauthenticated deep link redirected');
              assert(!/Spartan Incubator Service/i.test(deniedState.text), 'private dashboard not disclosed');
              await denied.close();

              for (const [name, width, height] of [['06-dashboard-desktop-1440',1440,1000],['07-dashboard-mobile-390',390,844],['08-dashboard-mobile-375',375,812],['08b-dashboard-mobile-320',320,568],['08c-dashboard-landscape-844',844,390]]) {
                const page = await newPage({ viewport: { width, height } });
                await routeAuthorizedSources(page);
                await login(page);
                await page.waitForSelector('.todayDirective');
                await page.waitForSelector('.ut-source-status[data-page="Today"]');
                await page.waitForSelector('.ut-live-countdown[data-state="ready"]');
                const state = await shot(page, name, 'authenticated-synthetic-oidc');
                assert(state.geometry.scrollWidth <= state.geometry.clientWidth, name + ' overflow');
                const bos = page.locator('[data-cc-workspace="bos"]');
                assert(await bos.getAttribute('aria-disabled') === 'true', name + ' BOS disabled');
                assert(/not deployed/i.test(await bos.getAttribute('title') || ''), name + ' BOS pending title');
                const switcherFocus = await keyboardFocusEvidence(page, '[data-cc-workspace="bos"]');
                state.switcherKeyboardFocus = switcherFocus;
                assert(switcherFocus.reached && switcherFocus.outlineStyle !== 'none' && parseFloat(switcherFocus.outlineWidth) >= 2, name + ' visible switcher keyboard focus');
                if (name === '07-dashboard-mobile-390') {
                  await page.screenshot({ path: 'evidence/15-dashboard-switcher-keyboard-focus-mobile-390.png', fullPage: true });
                  evidence.screenshots.push('15-dashboard-switcher-keyboard-focus-mobile-390.png');
                }
                const bodyText = await page.locator('body').innerText();
                state.nativeWorkspace = /Prepare class, unblock the Incubator, then move research forward/.test(bodyText) && /PROTOTYPE DECISION WORKSPACE/.test(bodyText);
                assert(state.nativeWorkspace, name + ' native Today workspace and provenance');
                assert(await page.locator('.ut-live-view').count() === 0, name + ' generic Calendar/Drive replacement absent');
                assert(/ENT 330 · Venture Validation/.test(await page.locator('.ut-live-countdown').getAttribute('aria-label') || ''), name + ' live next-event countdown');
                assert(!/MINUTES TO NEXT/.test(bodyText), name + ' fabricated static countdown hidden');
                await page.close();
              }

              const recorder = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(recorder);
              await login(recorder);
              await recorder.waitForSelector('.ut-live-countdown[data-state="ready"]');
              assert(await recorder.locator('.globalRecord').getAttribute('aria-label') === 'Open recording controls preview', 'recording trigger has truthful accessible name');
              await recorder.locator('.globalRecord').click();
              await recorder.waitForSelector('#cc-recorder.is-open');
              await recorder.evaluate(() => window.__ccRecorder.open());
              assert(/no audio is captured/i.test(await recorder.locator('#cc-recorder').innerText()), 'global Record Meeting is intercepted by truthful prototype recorder');
              const recorderTargets = await recorder.locator('#cc-recorder').evaluate(node => ['.cc-rec__close', '#cc-rec-start', '#cc-rec-dest', '#cc-rec-confirm'].map(selector => {
                const box = node.querySelector(selector).getBoundingClientRect();
                return { selector, width: box.width, height: box.height };
              }));
              assert(recorderTargets.every(target => target.width >= 44 && target.height >= 44), 'recorder controls are touch sized on mobile');
              assert(await recorder.locator('#cc-rec-save').isDisabled(), 'recorder Finish preview starts disabled');
              await recorder.locator('#cc-rec-confirm').click();
              assert(/Simulated destination .* confirmed for this preview/.test(await recorder.locator('#cc-rec-destnote').innerText()), 'recorder confirmation stays explicitly simulated');
              assert(await recorder.locator('#cc-rec-save').isDisabled(), 'destination confirmation alone cannot finish preview');
              await recorder.locator('#cc-rec-start').click();
              await recorder.waitForTimeout(1100);
              assert(await recorder.locator('#cc-recorder').getAttribute('data-cc-state') === 'recording', 'recorder timer-running state');
              assert(!/^00:00$/.test(await recorder.locator('#cc-rec-time').innerText()), 'recorder timer visibly advances');
              await recorder.locator('#cc-rec-pause').click();
              assert(await recorder.locator('#cc-recorder').getAttribute('data-cc-state') === 'paused', 'recorder timer-paused state');
              await recorder.locator('#cc-rec-pause').click();
              await recorder.locator('#cc-rec-stop').click();
              assert(await recorder.locator('#cc-recorder').getAttribute('data-cc-state') === 'stopped', 'recorder timer-stopped state');
              assert(/Ready to finish this preview/.test(await recorder.locator('#cc-rec-hint').innerText()), 'recorder final action remains a preview');
              await recorder.locator('#cc-rec-save').click();
              assert(await recorder.locator('#cc-recorder').getAttribute('data-cc-state') === 'saved', 'recorder prototype-complete state');
              assert(/Nothing was captured, filed or uploaded/.test(await recorder.locator('#cc-rec-done').innerText()), 'recorder completion makes no capture or filing claim');
              assert(await recorder.locator('.topApp').evaluate(node => node.inert), 'recorder makes background inert');
              await recorder.keyboard.press('Tab');
              assert(await recorder.locator('#cc-recorder').evaluate(node => node.contains(document.activeElement)), 'recorder traps forward focus after completion');
              await recorder.keyboard.press('Shift+Tab');
              assert(await recorder.locator('#cc-recorder').evaluate(node => node.contains(document.activeElement)), 'recorder traps reverse focus after completion');
              await recorder.locator('[data-cc-close]').last().click();
              assert(await recorder.locator('.globalRecord').evaluate(node => document.activeElement === node), 'recorder restores opener focus');
              assert(!await recorder.locator('.topApp').evaluate(node => node.inert), 'recorder restores background interaction');
              await recorder.close();

              const failSafe = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(failSafe);
              await login(failSafe);
              const response = await failSafe.goto(base + '/boss/', { waitUntil: 'domcontentloaded' });
              const failState = await shot(failSafe, '09-bos-direct-link-fail-safe-404', 'authenticated-sibling-denied');
              assert(response.status() === 404 && /not found/i.test(failState.text), 'BOS direct route fail safe');
              await failSafe.close();

              const replay = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(replay);
              await login(replay);
              const oldCookie = (await replay.context().cookies()).find(cookie => cookie.name === 'utampa_session');
              assert(Boolean(oldCookie), 'session cookie exists before logout');
              await replay.evaluate(async () => { await fetch('/logout', { method: 'POST' }); });
              await replay.context().addCookies([oldCookie]);
              await replay.goto(base + '/', { waitUntil: 'domcontentloaded' });
              const replayState = await shot(replay, '10-logout-replay-denied', 'logged-out-replay-denied');
              assert(/\/login\?next=/.test(replayState.url), 'revoked session replay redirected');
              assert(!/Spartan Incubator Service/i.test(replayState.text), 'revoked session disclosed no dashboard');
              await replay.close();

              const actions = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(actions);
              await login(actions);
              await actions.waitForSelector('.todayDirective');
              const firstTask = actions.locator('.todayTask', { hasText: 'Review next-class deck' });
              await firstTask.click();
              await actions.waitForSelector('.drawer .ut-action-controls');
              await actions.locator('.drawer .ut-complete').click();
              assert(await firstTask.isHidden(), 'completed Today item leaves active list');
              await actions.reload({ waitUntil: 'domcontentloaded' });
              await actions.waitForSelector('.todayDirective');
              assert(await actions.locator('.todayTask', { hasText: 'Review next-class deck' }).isHidden(), 'completed Today item persists after reload');
              await actions.waitForSelector('.ut-source-status .ut-mobile-actions-center');
              await actions.locator('.ut-source-status .ut-mobile-actions-center').click();
              await actions.waitForSelector('.ut-action-record');
              const actionState = await shot(actions, '11-action-center-review-and-restore', 'authenticated-local-action-state');
              actionState.actionCenterVisible = /Review next-class deck/.test(await actions.locator('.ut-live-drawer').innerText()) && /Completed/.test(await actions.locator('.ut-live-drawer').innerText());
              assert(actionState.actionCenterVisible, 'Action Center shows saved status');
              await actions.locator('.ut-action-record', { hasText: 'Review next-class deck' }).locator('.ut-restore-action').click();
              await actions.locator('.ut-live-drawer .drawerClose').click();
              assert(await actions.locator('.todayTask', { hasText: 'Review next-class deck' }).isVisible(), 'restored Today item returns to active list');
              await actions.reload({ waitUntil: 'domcontentloaded' });
              await actions.waitForSelector('.todayDirective');
              assert(await actions.locator('.todayTask', { hasText: 'Review next-class deck' }).isVisible(), 'restored Today item persists after reload');
              const routedTask = actions.locator('.todayTask', { hasText: 'Confirm lesson-plan sequence' });
              await routedTask.click();
              await actions.waitForSelector('.drawer .ut-action-controls');
              await actions.locator('.drawer .ut-route').click();
              assert(await actions.locator('.drawer .ut-action-controls select').getAttribute('aria-invalid') === 'true', 'empty route submission marks selection invalid');
              assert(await actions.locator('.drawer .ut-route-error').isVisible(), 'empty route submission announces an inline error');
              assert(await actions.locator('.drawer .ut-action-controls select').evaluate(node => document.activeElement === node), 'empty route submission focuses required selection');
              await actions.locator('.drawer .ut-action-controls select').selectOption('UTampa');
              assert(await actions.locator('.drawer .ut-route-error').isHidden(), 'route error clears after a valid selection');
              await actions.locator('.drawer .ut-route').click();
              assert(await routedTask.isHidden(), 'locally staged route leaves active Today list');
              assert(/nobody notified/i.test(await actions.locator('.ut-toast').innerText()), 'route semantics state that nobody was notified');
              assert(await actions.locator('.ut-toast').getAttribute('aria-atomic') === 'true', 'local route result is announced atomically');
              await actions.reload({ waitUntil: 'domcontentloaded' });
              await actions.waitForSelector('.todayDirective');
              assert(await actions.locator('.todayTask', { hasText: 'Confirm lesson-plan sequence' }).isHidden(), 'locally staged route persists after reload');
              await actions.locator('.ut-source-status .ut-mobile-actions-center').click();
              const routedRecord = actions.locator('.ut-action-record', { hasText: 'Confirm lesson-plan sequence' });
              assert(/Route staged locally/.test(await routedRecord.innerText()), 'Action Center labels local route truthfully');
              await routedRecord.locator('.ut-restore-action').click();
              await actions.locator('.ut-live-drawer .drawerClose').click();
              assert(await actions.locator('.todayTask', { hasText: 'Confirm lesson-plan sequence' }).isVisible(), 'restored route-staged item returns to Today');
              await actions.close();

              const service = await newPage({ viewport: { width: 844, height: 390 } });
              const serviceEvents = Array.from({ length: 9 }, (_, index) => ({
                id: 'event-service-' + index,
                title: 'Spartan Incubator Calendar title match ' + (index + 1),
                start: new Date(Date.now() + (index + 2) * 60 * 60 * 1000).toISOString(),
                end: new Date(Date.now() + (index + 3) * 60 * 60 * 1000).toISOString(),
                calendar: 'UTampa Outlook test feed',
                url: 'https://calendar.google.com/calendar/event?eid=service-' + index,
                allDay: false
              }));
              await routeAuthorizedSources(service, { events: serviceEvents, files: [{ id: 'file-service', name: 'Spartan Incubator mentor notes', mimeType: 'application/vnd.google-apps.document', modifiedTime: '2026-09-22T15:00:00Z', url: 'https://drive.google.com/open?id=service' }], driveTruncated: true });
              await login(service);
              await service.waitForSelector('.todayDirective');
              await service.locator('.sectionTabs button', { hasText: 'Teaching' }).click();
              await service.waitForSelector('.focusCourse');
              await service.waitForSelector('.ut-source-status[data-page="Teaching"]');
              assert(/PROTOTYPE COURSE WORKSPACE/.test(await service.locator('.ut-source-status').innerText()), 'Teaching source state');
              const teachingDraft = service.locator('.phoneChat footer textarea');
              await teachingDraft.fill('Synthetic browser-evidence draft');
              const inlineSend = service.locator('.phoneChat footer button', { hasText: 'Send' });
              await inlineSend.click();
              await service.waitForSelector('.ut-live-drawer');
              assert(/No message was sent or saved to a connected system/.test(await service.locator('.ut-live-drawer').innerText()), 'inline Teaching send stops at truthful boundary');
              await service.locator('.ut-live-drawer .drawerClose').click();
              assert(await teachingDraft.inputValue() === 'Synthetic browser-evidence draft', 'inline draft remains unsent and visibly local');
              assert(await inlineSend.evaluate(node => document.activeElement === node), 'inline send preview restores opener focus');
              await service.locator('.sectionTabs button', { hasText: 'Research' }).click();
              await service.waitForSelector('.pipeline');
              await service.waitForSelector('.ut-source-status[data-page="Research"]');
              assert(/Research workflow is not connected/.test(await service.locator('.ut-source-status').innerText()), 'Research source state');
              await service.getByRole('button', { name: 'Open manuscript', exact: true }).click();
              await service.waitForSelector('.drawer');
              assert(await service.locator('.drawer .ut-action-controls').count() === 0, 'non-Today prototype drawer does not claim persistent completion');
              assert(!/Connected university source/.test(await service.locator('.drawer').innerText()), 'generic drawer does not claim an unverified connected source');
              await service.locator('.drawer').getByRole('button', { name: 'Approve + continue', exact: true }).click();
              await service.waitForSelector('.ut-live-drawer');
              assert(/No connected-system action occurred/.test(await service.locator('.ut-live-drawer').innerText()), 'Research action stops at truthful discard boundary');
              await service.locator('.ut-live-drawer .drawerClose').click();
              const reviewChanges = service.getByRole('button', { name: 'Review changes', exact: true });
              await reviewChanges.click();
              await service.waitForSelector('.drawer[role="dialog"][aria-modal="true"]');
              assert(await service.locator('.drawer').isVisible(), 'native React drawer reopens in the same session after intercepted action');
              await service.keyboard.press('Escape');
              await service.waitForSelector('.drawerShade', { state: 'detached' });
              assert(await reviewChanges.evaluate(node => document.activeElement === node), 'native drawer Escape restores opener focus');
              await service.locator('.sectionTabs button', { hasText: 'Service' }).click();
              await service.waitForSelector('.serviceTopGrid');
