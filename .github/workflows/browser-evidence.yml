              await staleGuard.locator('.ut-calendar-panel .ut-refresh').click();
              await staleGuard.locator('.ut-calendar-panel .ut-refresh').click();
              await staleGuard.waitForFunction(() => document.body.innerText.includes('Newest panel refresh result'));
