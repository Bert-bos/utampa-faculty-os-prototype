              await driveUnavailable.locator('.prepareHeader').click();
              await driveUnavailable.waitForFunction(() => document.body.innerText.includes('Prepare Me is temporarily unavailable'));
              assert(/Nothing was changed/.test(await driveUnavailable.locator('.ut-live-drawer').innerText()), 'Drive failure leaves explicit unchanged state');
              assert(await driveUnavailable.locator('.ut-live-drawer [role="alert"]').getAttribute('aria-live') === 'assertive', 'Prepare Me failure is announced assertively');
              await driveUnavailable.close();

