name: UTampa exact-head browser evidence

on:
  pull_request:
    paths:
      - '.github/workflows/browser-evidence.yml'
      - 'server.js'
      - 'test/server.test.js'
      - 'cc-workspace-switcher.v2.js'
      - 'cc-incubator-adapter.v1.js'
      - 'utampa-live.v1.js'
      - 'utampa-live.v1.css'
      - 'index.html'
      - 'assets/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
      PORT: 4175
      GOOGLE_CLIENT_ID: synthetic-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: synthetic-evidence-client-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:4175/auth/google/callback
      UTAMPA_ALLOWED_EMAIL: bert@utampa.edu
      UTAMPA_SESSION_SECRET: synthetic-evidence-session-secret-32-chars
      UTAMPA_SYNTHETIC_OIDC: '1'
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node server.js >utampa.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/healthz >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat utampa.log
          exit 1

      - name: Capture synthetic exact-head browser states
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_BIN"
          export CHROME_BIN
          npm install --no-save --ignore-scripts playwright-core@1.55.0
          mkdir -p evidence
          cat > evidence.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const base = 'http://127.0.0.1:4175';
          const evidence = { exactHead: process.env.RC_SHA, identity: 'injected synthetic Google OIDC; no real account or token', data: 'browser-routed sanitized Calendar/Drive metadata fixtures only; no real/private/FERPA/student/founder data', screenshots: [], checks: {}, failures: [] };
          const assert = (ok, message) => { if (!ok) evidence.failures.push(message); };
          async function shot(page, name, authState) {
            await page.screenshot({ path: 'evidence/' + name + '.png', fullPage: true });
            evidence.screenshots.push(name + '.png');
            const geometry = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth }));
            evidence.checks[name] = { authState, url: page.url(), title: await page.title(), text: (await page.locator('body').innerText()).slice(0, 1800), geometry };
            return evidence.checks[name];
          }
          async function keyboardFocusEvidence(page, selector, maxTabs = 40) {
            await page.evaluate(() => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
            for (let index = 0; index < maxTabs; index += 1) {
              await page.keyboard.press('Tab');
              const result = await page.evaluate(target => {
                const active = document.activeElement;
                if (!active || !active.matches(target)) return null;
                const style = getComputedStyle(active);
                return { reached: true, tag: active.tagName, text: (active.textContent || '').trim(), outlineStyle: style.outlineStyle, outlineWidth: style.outlineWidth, outlineColor: style.outlineColor };
              }, selector);
              if (result) return result;
            }
            return { reached: false };
          }
          async function login(page, next = '/') {
            await page.goto(base + '/login?next=' + encodeURIComponent(next), { waitUntil: 'domcontentloaded' });
            await Promise.all([page.waitForURL(base + next), page.locator('[data-testid=google-sign-in]').click()]);
            await page.waitForSelector('[data-cc-workspace="bos"][aria-disabled="true"]');
            await page.waitForTimeout(250);
            assert(await page.locator('input[type=password]').count() === 0, 'no local password field');
          }
          async function routeAuthorizedSources(page, options = {}) {
            const events = options.events === undefined ? [{ id: 'event-1', title: 'ENT 330 · Venture Validation', start: '2026-09-23T16:00:00Z', end: '2026-09-23T17:00:00Z', location: 'Sykes 134', url: 'https://calendar.google.com/calendar/event?eid=synthetic', allDay: false }] : options.events;
            const files = options.files === undefined ? [{ id: 'file-1', name: 'ENT 330 Venture Validation Deck', mimeType: 'application/vnd.google-apps.presentation', modifiedTime: '2026-09-22T15:00:00Z', url: 'https://drive.google.com/open?id=synthetic' }] : options.files;
            await page.route('**/api/calendar', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ events, source: 'Google Calendar (read-only test fixture)' }) }));
            await page.route('**/api/drive**', route => route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ files, source: 'Google Drive metadata (read-only test fixture)' }) }));
          }
          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_BIN, args: ['--no-sandbox'] });
            try {
              for (const [name, width, height] of [['01-login-desktop-1440',1440,1000],['02-login-mobile-390',390,844],['03-login-mobile-375',375,812]]) {
                const page = await browser.newPage({ viewport: { width, height } });
                await page.goto(base + '/login', { waitUntil: 'domcontentloaded' });
                const state = await shot(page, name, 'unauthenticated-entry');
                assert(/continue with google/i.test(state.text), name + ' Google identity entry');
                assert(/^My Work Login/m.test(state.text), name + ' neutral login label');
                assert(!/University of Tampa|Faculty OS/i.test(state.text), name + ' no University branding');
                assert(state.geometry.scrollWidth <= state.geometry.clientWidth, name + ' overflow');
                const buttonHeight = await page.locator('[data-testid=google-sign-in]').evaluate(node => node.getBoundingClientRect().height);
                assert(buttonHeight >= 44, name + ' touch target');
                const focusEvidence = await keyboardFocusEvidence(page, '[data-testid=google-sign-in]');
                state.googleKeyboardFocus = focusEvidence;
                assert(focusEvidence.reached && focusEvidence.outlineStyle !== 'none' && parseFloat(focusEvidence.outlineWidth) >= 3, name + ' visible Google keyboard focus');
                if (name === '02-login-mobile-390') {
                  await page.screenshot({ path: 'evidence/14-login-keyboard-focus-mobile-390.png', fullPage: true });
                  evidence.screenshots.push('14-login-keyboard-focus-mobile-390.png');
                }
                await page.evaluate(() => document.querySelector('[data-testid=google-sign-in]').addEventListener('click', event => event.preventDefault(), { capture: true, once: true }));
                await page.locator('[data-testid=google-sign-in]').click();
                const loadingEvidence = await page.locator('#auth-status').evaluate(node => ({ text: node.textContent, role: node.getAttribute('role'), live: node.getAttribute('aria-live'), atomic: node.getAttribute('aria-atomic') }));
                state.assistiveLoading = loadingEvidence;
                assert(/opening google sign-in/i.test(loadingEvidence.text || '') && loadingEvidence.role === 'status' && loadingEvidence.live === 'polite' && loadingEvidence.atomic === 'true', name + ' assistive loading announcement');
                await page.close();
              }

              const error = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await error.goto(base + '/login?error=sign-in');
              await error.waitForSelector('[role=alert]');
              const errorState = await shot(error, '04-oauth-error-mobile-390', 'oauth-error-local-only');
              assert(/could not complete sign-in/i.test(errorState.text), 'safe OAuth error message');
              assert(await error.locator('[role=alert]').evaluate(node => document.activeElement === node), 'error focus');
              const errorAnnouncement = await error.locator('[role=alert]').evaluate(node => ({ role: node.getAttribute('role'), live: node.getAttribute('aria-live'), atomic: node.getAttribute('aria-atomic'), focused: document.activeElement === node }));
              errorState.assistiveError = errorAnnouncement;
              assert(errorAnnouncement.role === 'alert' && errorAnnouncement.live === 'assertive' && errorAnnouncement.atomic === 'true' && errorAnnouncement.focused, 'assistive OAuth error announcement and focus return');
              assert(errorState.geometry.scrollWidth <= errorState.geometry.clientWidth, 'error overflow');
              await error.close();

              const denied = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await denied.goto(base + '/service/spartan-incubator', { waitUntil: 'domcontentloaded' });
              const deniedState = await shot(denied, '05-unauthenticated-deep-link-denied', 'unauthenticated-denied');
              assert(/\/login\?next=/.test(deniedState.url), 'unauthenticated deep link redirected');
              assert(!/Spartan Incubator Service/i.test(deniedState.text), 'private dashboard not disclosed');
              await denied.close();

              for (const [name, width, height] of [['06-dashboard-desktop-1440',1440,1000],['07-dashboard-mobile-390',390,844],['08-dashboard-mobile-375',375,812]]) {
                const page = await browser.newPage({ viewport: { width, height } });
                await routeAuthorizedSources(page);
                await login(page);
                await page.waitForSelector('.todayDirective');
                await page.waitForSelector('.ut-source-status[data-page="Today"]');
                const state = await shot(page, name, 'authenticated-synthetic-oidc');
                assert(state.geometry.scrollWidth <= state.geometry.clientWidth, name + ' overflow');
                const bos = page.locator('[data-cc-workspace="bos"]');
                assert(await bos.getAttribute('aria-disabled') === 'true', name + ' BOS disabled');
                assert(/not deployed/i.test(await bos.getAttribute('title') || ''), name + ' BOS pending title');
                const switcherFocus = await keyboardFocusEvidence(page, '[data-cc-workspace="bos"]');
                state.switcherKeyboardFocus = switcherFocus;
                assert(switcherFocus.reached && switcherFocus.outlineStyle !== 'none' && parseFloat(switcherFocus.outlineWidth) >= 2, name + ' visible switcher keyboard focus');
                if (name === '07-dashboard-mobile-390') {
                  await page.screenshot({ path: 'evidence/15-dashboard-switcher-keyboard-focus-mobile-390.png', fullPage: true });
                  evidence.screenshots.push('15-dashboard-switcher-keyboard-focus-mobile-390.png');
                }
                const bodyText = await page.locator('body').innerText();
                state.nativeWorkspace = /Prepare class, unblock the Incubator, then move research forward/.test(bodyText) && /PROTOTYPE DECISION WORKSPACE/.test(bodyText);
                assert(state.nativeWorkspace, name + ' native Today workspace and provenance');
                assert(await page.locator('.ut-live-view').count() === 0, name + ' generic Calendar/Drive replacement absent');
                await page.close();
              }

              const failSafe = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await login(failSafe);
              const response = await failSafe.goto(base + '/boss/', { waitUntil: 'domcontentloaded' });
              const failState = await shot(failSafe, '09-bos-direct-link-fail-safe-404', 'authenticated-sibling-denied');
              assert(response.status() === 404 && /not found/i.test(failState.text), 'BOS direct route fail safe');
              await failSafe.close();

              const replay = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await login(replay);
              const oldCookie = (await replay.context().cookies()).find(cookie => cookie.name === 'utampa_session');
              assert(Boolean(oldCookie), 'session cookie exists before logout');
              await replay.evaluate(async () => { await fetch('/logout', { method: 'POST' }); });
              await replay.context().addCookies([oldCookie]);
              await replay.goto(base + '/', { waitUntil: 'domcontentloaded' });
              const replayState = await shot(replay, '10-logout-replay-denied', 'logged-out-replay-denied');
              assert(/\/login\?next=/.test(replayState.url), 'revoked session replay redirected');
              assert(!/Spartan Incubator Service/i.test(replayState.text), 'revoked session disclosed no dashboard');
              await replay.close();

              const actions = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(actions);
              await login(actions);
              await actions.waitForSelector('.todayDirective');
              const firstTask = actions.locator('.todayTask', { hasText: 'Review next-class deck' });
              await firstTask.click();
              await actions.waitForSelector('.drawer .ut-action-controls');
              await actions.locator('.drawer .ut-complete').click();
              assert(await firstTask.isHidden(), 'completed Today item leaves active list');
              await actions.reload({ waitUntil: 'domcontentloaded' });
              await actions.waitForSelector('.todayDirective');
              assert(await actions.locator('.todayTask', { hasText: 'Review next-class deck' }).isHidden(), 'completed Today item persists after reload');
              await actions.waitForSelector('.ut-source-status .ut-mobile-actions-center');
              await actions.locator('.ut-source-status .ut-mobile-actions-center').click();
              await actions.waitForSelector('.ut-action-record');
              const actionState = await shot(actions, '11-action-center-review-and-restore', 'authenticated-local-action-state');
              actionState.actionCenterVisible = /Review next-class deck/.test(await actions.locator('.ut-live-drawer').innerText()) && /Completed/.test(await actions.locator('.ut-live-drawer').innerText());
              assert(actionState.actionCenterVisible, 'Action Center shows saved status');
              await actions.locator('.ut-action-record', { hasText: 'Review next-class deck' }).locator('.ut-restore-action').click();
              await actions.locator('.ut-live-drawer .drawerClose').click();
              assert(await actions.locator('.todayTask', { hasText: 'Review next-class deck' }).isVisible(), 'restored Today item returns to active list');
              await actions.reload({ waitUntil: 'domcontentloaded' });
              await actions.waitForSelector('.todayDirective');
              assert(await actions.locator('.todayTask', { hasText: 'Review next-class deck' }).isVisible(), 'restored Today item persists after reload');
              await actions.close();

              const service = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(service, { events: [{ id: 'event-service', title: 'Spartan Incubator mentor review', start: '2026-09-24T16:00:00Z', end: '2026-09-24T17:00:00Z', url: 'https://calendar.google.com/calendar/event?eid=service', allDay: false }], files: [{ id: 'file-service', name: 'Spartan Incubator mentor notes', mimeType: 'application/vnd.google-apps.document', modifiedTime: '2026-09-22T15:00:00Z', url: 'https://drive.google.com/open?id=service' }] });
              await login(service);
              await service.waitForSelector('.todayDirective');
              await service.locator('.sectionTabs button', { hasText: 'Teaching' }).click();
              await service.waitForSelector('.focusCourse');
              await service.waitForSelector('.ut-source-status[data-page="Teaching"]');
              assert(/SOURCE-LINKED PROTOTYPE/.test(await service.locator('.ut-source-status').innerText()), 'Teaching source state');
              await service.locator('.sectionTabs button', { hasText: 'Research' }).click();
              await service.waitForSelector('.pipeline');
              await service.waitForSelector('.ut-source-status[data-page="Research"]');
              assert(/Research workflow is not connected/.test(await service.locator('.ut-source-status').innerText()), 'Research source state');
              await service.locator('.sectionTabs button', { hasText: 'Service' }).click();
              await service.waitForSelector('.serviceTopGrid');
              await service.waitForSelector('.ut-source-status[data-page="Service"]');
              const serviceState = await shot(service, '12-page-specific-workspaces', 'authenticated-page-specific-workspaces');
              serviceState.nativeServiceVisible = /SAMPLE \/ PROTOTYPE DATA/.test(await service.locator('.ut-source-status').innerText());
              assert(serviceState.nativeServiceVisible, 'Service native workspace and source state');
              await service.getByRole('button', { name: 'Share with founder', exact: true }).first().click();
              await service.waitForSelector('.reviewModal');
              await service.locator('.reviewModal').getByRole('button', { name: 'Share with founder', exact: true }).click();
              await service.waitForSelector('.ut-live-drawer');
              assert(/Nothing was sent or submitted/.test(await service.locator('.ut-live-drawer').innerText()), 'external action stopped at local review boundary');
              await service.locator('.ut-live-drawer .drawerClose').click();
              await service.locator('.sectionTabs button', { hasText: 'People' }).click();
              await service.waitForSelector('.peopleWorkspace');
              await service.waitForSelector('.ut-source-status[data-page="People"]');
              assert(/No directory, contacts, or student system is connected/.test(await service.locator('.ut-source-status').innerText()), 'People data boundary');
              await service.locator('.sectionTabs button', { hasText: 'Calendar' }).click();
              await service.waitForSelector('.ut-calendar-panel .ut-event');
              assert(/Spartan Incubator mentor review/.test(await service.locator('.ut-calendar-panel').innerText()), 'Calendar authorized live content');
              await service.locator('.ut-calendar-panel .ut-mobile-prepare').click();
              await service.waitForSelector('.ut-live-drawer .ut-file');
              assert(/Spartan Incubator mentor notes/.test(await service.locator('.ut-live-drawer').innerText()), 'Prepare Me related Drive source');
              await service.close();

              const noData = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(noData, { events: [], files: [] });
              await login(noData);
              await noData.waitForSelector('.todayDirective');
              await noData.locator('.sectionTabs button', { hasText: 'Calendar' }).click();
              await noData.waitForFunction(() => document.body.innerText.includes('No events found'));
              const noDataState = await shot(noData, '13-calendar-authorized-empty-state', 'authenticated-authorized-empty');
              const noDataText = await noData.locator('body').innerText();
              noDataState.emptyStateVisible = noDataText.includes('No events found') && noDataText.includes('selected personal Google calendars');
              assert(noDataState.emptyStateVisible, 'authorized Calendar empty source explained');
              await noData.close();

              const verifiedZero = await browser.newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(verifiedZero);
              await login(verifiedZero);
              await verifiedZero.waitForSelector('.todayDirective');
              await verifiedZero.locator('.sectionTabs button', { hasText: 'People' }).click();
              await verifiedZero.waitForSelector('.peopleWorkspace');
              await verifiedZero.waitForFunction(() => document.body.innerText.includes('No directory, contacts, or student system is connected'));
              const zeroState = await shot(verifiedZero, '14-people-protected-boundary-empty', 'authenticated-protected-boundary');
              const zeroText = await verifiedZero.locator('body').innerText();
              zeroState.peopleBoundaryVisible = zeroText.includes('No directory, contacts, or student system is connected') && zeroText.includes('source-needed are not verified');
              assert(zeroState.peopleBoundaryVisible, 'People boundary and provenance state');
              await verifiedZero.locator('.ut-source-status .ut-mobile-search').click();
              await verifiedZero.locator('#ut-search-input').fill('ENT 330');
              await verifiedZero.locator('.ut-search-form button').click();
              await verifiedZero.waitForSelector('.ut-search-results .ut-event');
              assert(/ENT 330 · Venture Validation/.test(await verifiedZero.locator('.ut-search-results').innerText()), 'Search returns authorized Calendar result');
              await verifiedZero.close();

              evidence.verdict = evidence.failures.length ? 'FAIL' : 'PASS';
              fs.writeFileSync('evidence/evidence.json', JSON.stringify(evidence, null, 2));
              if (evidence.failures.length) process.exitCode = 1;
            } finally { await browser.close(); }
          })().catch(error => { evidence.verdict = 'ERROR'; evidence.fatal = String(error.stack || error); fs.writeFileSync('evidence/evidence.json', JSON.stringify(evidence, null, 2)); console.error(error); process.exit(1); });
          NODE
          node evidence.cjs

      - name: Manifest and checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp utampa.log evidence/utampa.log 2>/dev/null || true
          {
            echo "UTAMPA_EXACT_BROWSER_EVIDENCE_READY"
            echo "EXACT_HEAD=$RC_SHA"
            echo "RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "IDENTITY=injected synthetic Google OIDC; no real account or token"
            echo "DATA=browser-routed sanitized Calendar/Drive metadata fixtures only; no real/private/FERPA/student/founder data"
          } > evidence/MANIFEST.txt
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utampa-exact-browser-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 7
