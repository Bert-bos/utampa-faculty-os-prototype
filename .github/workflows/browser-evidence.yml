              assert(/New current filename/.test(newestSearchText) && !/Old stale filename/.test(newestSearchText), 'older Search response cannot overwrite the newest result');
              await staleGuard.close();

              const partial = await newPage({ viewport: { width: 375, height: 812 } });
              await routeAuthorizedSources(partial, { events: [], files: [], partial: true });
