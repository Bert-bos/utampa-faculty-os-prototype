              assert(!/No matching Drive filenames were found/.test(driveTruncatedText), 'truncated empty first Drive page is never presented as verified empty');
              await driveTruncatedEmpty.close();

              const verifiedZero = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(verifiedZero);
              await login(verifiedZero);
              await verifiedZero.waitForSelector('.ut-unavailable-view[data-page="Today"]');
              await verifiedZero.locator('.sectionTabs button', { hasText: 'People' }).click();
              await verifiedZero.waitForSelector('.ut-unavailable-view[data-page="People"]');
              await verifiedZero.waitForFunction(() => document.body.innerText.includes('People data is unavailable'));
