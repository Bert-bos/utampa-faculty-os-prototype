              await verifiedZero.keyboard.press('Escape');
              await verifiedZero.waitForSelector('.ut-live-shade', { state: 'detached' });
              assert(await searchOpener.evaluate(node => document.activeElement === node), 'Escape closes live drawer and restores opener focus');
              await verifiedZero.close();

              evidence.diagnostics = diagnostics;
              assert(diagnostics.length === 0, 'no console, page, or failed-request diagnostics: ' + diagnostics.join(' | '));
              evidence.verdict = evidence.failures.length ? 'FAIL' : 'PASS';
              fs.writeFileSync('evidence/evidence.json', JSON.stringify(evidence, null, 2));
              if (evidence.failures.length) process.exitCode = 1;
            } finally { await browser.close(); }
          })().catch(error => { evidence.verdict = 'ERROR'; evidence.fatal = String(error.stack || error); fs.writeFileSync('evidence/evidence.json', JSON.stringify(evidence, null, 2)); console.error(error); process.exit(1); });
          NODE
          node evidence.cjs

      - name: Finalize ready evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const evidence = JSON.parse(fs.readFileSync('evidence/evidence.json', 'utf8'));
          if (evidence.exactHead !== process.env.RC_SHA) throw new Error('evidence exact head mismatch');
          if (evidence.verdict !== 'PASS') throw new Error('evidence verdict is not PASS');
          if (!Array.isArray(evidence.failures) || evidence.failures.length) throw new Error('evidence contains failures');
          if (!Array.isArray(evidence.diagnostics) || evidence.diagnostics.length) throw new Error('evidence contains diagnostics');
          if (!Array.isArray(evidence.screenshots) || !evidence.screenshots.length) throw new Error('evidence has no screenshots');
          if (!evidence.runtime || !evidence.runtime.node || evidence.runtime.playwright !== '1.55.0' || !evidence.runtime.browser) throw new Error('evidence runtime versions are missing or unexpected');
          for (const file of evidence.screenshots) {
            if (!fs.existsSync('evidence/' + file)) throw new Error('missing screenshot: ' + file);
          }
          NODE
          cp utampa.log evidence/utampa.log 2>/dev/null || true
          {
            echo "UTAMPA_EXACT_BROWSER_EVIDENCE_READY"
            echo "EXACT_HEAD=$RC_SHA"
            echo "RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "IDENTITY=injected synthetic Google OIDC for bert@bertseither.com; no real account or token"
            echo "DATA=committed prototype interface plus browser-routed synthetic Calendar/Drive metadata fixtures; no external private/protected source or real account was queried"
          } > evidence/MANIFEST.txt
          node <<'NODE' >> evidence/MANIFEST.txt
          const evidence = require('./evidence/evidence.json');
          console.log('RUNTIME_NODE=' + evidence.runtime.node);
          console.log('RUNTIME_PLAYWRIGHT=' + evidence.runtime.playwright);
          console.log('RUNTIME_BROWSER=' + evidence.runtime.browser);
          NODE
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload exact ready evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: utampa-exact-browser-evidence-${{ env.RC_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Finalize failed diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp utampa.log evidence/utampa.log 2>/dev/null || true
          {
            echo "UTAMPA_EXACT_BROWSER_EVIDENCE_NOT_READY"
            echo "EXACT_HEAD=$RC_SHA"
            echo "RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > evidence/MANIFEST.txt
          find evidence -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > evidence/SHA256SUMS.txt

      - name: Upload failed browser diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: utampa-browser-diagnostics-${{ env.RC_SHA }}
          path: evidence/
          if-no-files-found: error
          retention-days: 7
