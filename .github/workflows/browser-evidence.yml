              await driveTruncatedEmpty.waitForSelector('.ut-source-status .ut-mobile-prepare');
              await driveTruncatedEmpty.locator('.ut-source-status .ut-mobile-prepare').click();
              await driveTruncatedEmpty.waitForFunction(() => document.body.innerText.includes('No complete Drive filename result'));
              const driveTruncatedText = await driveTruncatedEmpty.locator('.ut-live-drawer').innerText();
