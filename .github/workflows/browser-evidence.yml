name: UTampa exact-head browser evidence

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
      PORT: 4175
      GOOGLE_CLIENT_ID: synthetic-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: synthetic-evidence-client-secret
      GOOGLE_REDIRECT_URI: http://127.0.0.1:4175/auth/google/callback
      UTAMPA_ALLOWED_EMAIL: owner@example.test
      UTAMPA_SESSION_SECRET: synthetic-evidence-session-secret-32-chars
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify exact checkout and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RC_SHA"
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          node test/browser-server.js >utampa.log 2>&1 &
          PORT=4176 GOOGLE_REDIRECT_URI=http://127.0.0.1:4176/auth/google/callback UTAMPA_BROWSER_SECTION_FIXTURE=connected node test/browser-server.js >utampa-configured.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/healthz >/dev/null && curl -fsS http://127.0.0.1:4176/healthz >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat utampa.log
          cat utampa-configured.log
          exit 1

      - name: Capture synthetic exact-head browser states
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
          mkdir -p evidence
          cat > evidence.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const base = 'http://127.0.0.1:4175';
          const configuredBase = 'http://127.0.0.1:4176';
          const evidence = { exactHead: process.env.RC_SHA, identity: 'injected synthetic Google OIDC for a non-production test identity; no real account or token', data: 'fail-closed and browser-routed synthetic section-contract states plus synthetic Calendar/Drive metadata fixtures; no external private/protected source or real account was queried', screenshots: [], checks: {}, failures: [] };
          const diagnostics = [];
          const assert = (ok, message) => { if (!ok) evidence.failures.push(message); };
          async function shot(page, name, authState) {
            await page.screenshot({ path: 'evidence/' + name + '.png', fullPage: true });
            evidence.screenshots.push(name + '.png');
            const geometry = await page.evaluate(() => ({ scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth }));
            evidence.checks[name] = { authState, url: page.url(), title: await page.title(), text: (await page.locator('body').innerText()).slice(0, 1800), geometry };
            return evidence.checks[name];
          }
          async function keyboardFocusEvidence(page, selector, maxTabs = 40) {
            await page.evaluate(() => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
            for (let index = 0; index < maxTabs; index += 1) {
              await page.keyboard.press('Tab');
              const result = await page.evaluate(target => {
                const active = document.activeElement;
                if (!active || !active.matches(target)) return null;
                const style = getComputedStyle(active);
                return { reached: true, tag: active.tagName, text: (active.textContent || '').trim(), outlineStyle: style.outlineStyle, outlineWidth: style.outlineWidth, outlineColor: style.outlineColor };
              }, selector);
              if (result) return result;
            }
            return { reached: false };
          }
          async function waitForAppHydrated(page) {
            await page.waitForFunction(() => window.__UTAMPA_APP_COMMITTED__ === true);
            await page.waitForSelector('.ut-section-view[data-page="Today"],.ut-unavailable-view[data-page="Today"]');
          }
          async function login(page, next = '/', origin = base) {
            await page.goto(origin + '/login?next=' + encodeURIComponent(next), { waitUntil: 'domcontentloaded' });
            await Promise.all([page.waitForURL(origin + next), page.locator('[data-testid=google-sign-in]').click()]);
            await waitForAppHydrated(page);
            await page.waitForSelector('[data-cc-workspace="bos"][aria-disabled="true"]');
            await page.waitForTimeout(250);
            assert(await page.locator('input[type=password]').count() === 0, 'no local password field');
            const me = await page.evaluate(async () => { const response = await fetch('/api/me'); return { status: response.status, body: await response.json() }; });
            assert(me.status === 200 && me.body.email === 'owner@example.test', 'authenticated identity is the configured synthetic test account');
          }
          async function routeAuthorizedSources(page, options = {}) {
            const future = hours => new Date(Date.now() + hours * 60 * 60 * 1000).toISOString();
            const events = options.events === undefined ? [{ id: 'event-1', title: 'ENT 330 · Venture Validation', start: future(2), end: future(3), location: 'Sykes 134', calendar: 'Personal test calendar', url: 'https://calendar.google.com/calendar/event?eid=synthetic', allDay: false }] : options.events;
            const files = options.files === undefined ? [{ id: 'file-1', name: 'ENT 330 Venture Validation Deck', mimeType: 'application/vnd.google-apps.presentation', modifiedTime: '2026-09-22T15:00:00Z', url: 'https://drive.google.com/open?id=synthetic' }] : options.files;
            const calendarStatus = options.calendarStatus || 200;
            const calendarBody = calendarStatus === 401 ? { error: 'authentication_required' } : calendarStatus === 409 ? { error: 'reauthorization_required' } : calendarStatus >= 400 ? { error: 'calendar_unavailable' } : { events, source: 'Google Calendar · read-only test fixture', partial: Boolean(options.partial), truncated: Boolean(options.truncated), warnings: options.partial ? [{ code: 'calendar_unavailable', calendar: 'Synthetic unavailable source' }] : [] };
            const driveStatus = options.driveStatus || 200;
            const driveBody = driveStatus === 401 ? { error: 'authentication_required' } : driveStatus === 409 ? { error: 'reauthorization_required' } : driveStatus >= 400 ? { error: 'drive_unavailable' } : { files, source: 'Google Drive metadata (read-only test fixture)', truncated: Boolean(options.driveTruncated) };
            await page.route('**/api/calendar', route => route.fulfill({ status: calendarStatus, contentType: 'application/json', body: JSON.stringify(calendarBody) }));
            await page.route('**/api/drive**', route => route.fulfill({ status: driveStatus, contentType: 'application/json', body: JSON.stringify(driveBody) }));
            if (options.sections || options.sectionStatus) {
              await page.route('**/api/sections/*', route => {
                const sectionId = new URL(route.request().url()).pathname.split('/').pop();
                const status = options.sectionStatus || 200;
                const body = status === 401
                  ? { error: 'authentication_required' }
                  : status >= 400
                    ? { error: 'section_unavailable' }
                    : options.sections && options.sections[sectionId];
                return route.fulfill({ status, contentType: 'application/json', body: JSON.stringify(body || { error: 'not_found' }) });
              });
            }
          }
          function sectionView(sectionId, config = {}) {
            const generatedAt = config.generatedAt || new Date().toISOString();
            const items = config.items || [];
            const status = config.status || 'complete';
            const hasRecords = status === 'complete' || status === 'partial';
            return {
              viewVersion: 'utampa-section-view.v1',
              feedId: config.feedId || 'feed:browser-contract-v1',
              generatedAt,
              servedAt: config.servedAt || new Date().toISOString(),
              section: {
                id: sectionId,
                asOf: config.asOf !== undefined ? config.asOf : hasRecords ? generatedAt : null,
                freshness: config.freshness || (hasRecords ? 'current' : 'unknown'),
                staleAfter: config.staleAfter !== undefined ? config.staleAfter : hasRecords ? new Date(Date.now() + 60 * 60 * 1000).toISOString() : null,
                completeness: {
                  status,
                  expectedCount: config.expectedCount === undefined ? hasRecords ? items.length : null : config.expectedCount,
                  receivedCount: hasRecords ? items.length : null,
                  ...(config.reason ? { reason: config.reason } : {})
                },
                items
              }
            };
          }
          function sectionItem(section, id, title, config = {}) {
            const asOf = config.asOf || new Date().toISOString();
            return {
              id,
              section,
              category: config.category || 'task',
              title,
              summary: config.summary === undefined ? 'Sanitized browser evidence summary.' : config.summary,
              status: config.status || 'open',
              priority: config.priority === undefined ? 1 : config.priority,
              needsOwner: config.needsOwner === undefined ? true : config.needsOwner,
              asOf,
              freshness: config.freshness || 'current',
              staleAfter: config.staleAfter || new Date(Date.now() + 60 * 60 * 1000).toISOString(),
              dueAt: config.dueAt || null,
              startAt: config.startAt || null,
              endAt: config.endAt || null,
              tags: config.tags || ['approved-fixture'],
              actions: config.actions || []
            };
          }
          function connectedSectionFixtures() {
            const literalTitle = 'Same title <img src=x onerror="window.__sectionXss=1">';
            const current = new Date().toISOString();
            const future = new Date(Date.now() + 60 * 60 * 1000).toISOString();
            const staleAsOf = new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString();
            const stale = new Date(Date.now() - 60 * 60 * 1000).toISOString();
            return {
              literalTitle,
              sections: {
                today: sectionView('today', { items: [
                  sectionItem('today', 'item:opaque-alpha', literalTitle, {
                    summary: '<script>window.__sectionXss=2</script> literal summary', asOf: current, staleAfter: future,
                    actions: [
                      { type: 'open_details', label: 'Open details' },
                      { type: 'open_source', label: 'Open source', href: 'https://docs.google.com/document/d/synthetic-view' },
                      { type: 'prepare', label: 'Prepare locally' },
                      { type: 'complete_local', label: 'Complete locally' }
                    ]
                  }),
                  sectionItem('today', 'item:opaque-beta', literalTitle, {
                    summary: 'Second same-title item with its own opaque identity.', asOf: current, staleAfter: future,
                    actions: [
                      { type: 'open_details', label: 'Open details' },
                      { type: 'open_section', label: 'Open section', targetSection: 'research' },
                      { type: 'dismiss_local', label: 'Dismiss locally' },
                      { type: 'stage_route_local', label: 'Stage route locally' }
                    ]
                  })
                ] }),
                teaching: sectionView('teaching', { status: 'unavailable', expectedCount: null, items: [], reason: 'The approved private source is currently unavailable.' }),
                research: sectionView('research', { asOf: staleAsOf, freshness: 'stale', staleAfter: stale, items: [
                  sectionItem('research', 'item:opaque-research', 'Verified research checkpoint', { asOf: staleAsOf, freshness: 'stale', staleAfter: stale, actions: [{ type: 'open_details', label: 'Open details' }] })
                ] }),
                service: sectionView('service', { status: 'partial', expectedCount: 3, items: [], reason: 'The approved source returned an incomplete result.' }),
                people: sectionView('people', { status: 'complete', expectedCount: 0, items: [] })
              }
            };
          }
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--no-sandbox'] });
            evidence.runtime = { node: process.version, playwright: require('playwright/package.json').version, browser: await browser.version() };
            async function newPage(options) {
              const page = await browser.newPage(options);
              page.on('pageerror', error => diagnostics.push('pageerror: ' + String(error)));
              page.on('console', message => {
                const expected = page.__expectedFailedResource;
                const source = message.location()?.url || '';
                if (expected && source && new URL(source).pathname === expected) return;
                if (message.type() === 'error' && !/^Failed to load resource: the server responded with a status of \d+/.test(message.text())) diagnostics.push('console: ' + message.text());
              });
              page.on('requestfailed', request => {
                if (page.__expectedFailedResource && new URL(request.url()).pathname === page.__expectedFailedResource) return;
                if (!/ERR_ABORTED/.test(request.failure()?.errorText || '')) diagnostics.push('requestfailed: ' + request.url() + ' · ' + (request.failure()?.errorText || 'unknown'));
              });
              page.on('response', response => {
                const target = new URL(response.url());
                if (target.origin !== base || response.status() < 400) return;
                if (target.pathname === '/boss/' || target.pathname === '/api/calendar' || target.pathname === '/api/drive' || target.pathname.startsWith('/api/sections/')) return;
                diagnostics.push('http ' + response.status() + ': ' + response.url());
              });
              return page;
            }
            try {
              for (const [name, width, height] of [['01-login-desktop-1440',1440,1000],['02-login-mobile-390',390,844],['03-login-mobile-375',375,812],['03b-login-mobile-320',320,568]]) {
                const page = await newPage({ viewport: { width, height } });
                await page.goto(base + '/login', { waitUntil: 'domcontentloaded' });
                const state = await shot(page, name, 'unauthenticated-entry');
                assert(/continue with google/i.test(state.text), name + ' Google identity entry');
                assert(/^My Work Login/m.test(state.text), name + ' neutral login label');
                assert(!/University of Tampa|Faculty OS/i.test(state.text), name + ' no University branding');
                assert(/read-only Calendar event metadata and Drive filename metadata visible to this personal Google account/i.test(state.text), name + ' pre-consent personal metadata disclosure');
                assert(/University accounts, Canvas, Workday, student records, and institutional systems are not connected/i.test(state.text), name + ' pre-consent institutional boundary');
                assert(state.geometry.scrollWidth <= state.geometry.clientWidth, name + ' overflow');
                const buttonHeight = await page.locator('[data-testid=google-sign-in]').evaluate(node => node.getBoundingClientRect().height);
                assert(buttonHeight >= 44, name + ' touch target');
                const focusEvidence = await keyboardFocusEvidence(page, '[data-testid=google-sign-in]');
                state.googleKeyboardFocus = focusEvidence;
                assert(focusEvidence.reached && focusEvidence.outlineStyle !== 'none' && parseFloat(focusEvidence.outlineWidth) >= 3, name + ' visible Google keyboard focus');
                if (name === '02-login-mobile-390') {
                  await page.screenshot({ path: 'evidence/14-login-keyboard-focus-mobile-390.png', fullPage: true });
                  evidence.screenshots.push('14-login-keyboard-focus-mobile-390.png');
                }
                await page.evaluate(() => document.querySelector('[data-testid=google-sign-in]').addEventListener('click', event => event.preventDefault(), { capture: true, once: true }));
                await page.locator('[data-testid=google-sign-in]').click();
                const loadingEvidence = await page.locator('#auth-status').evaluate(node => ({ text: node.textContent, role: node.getAttribute('role'), live: node.getAttribute('aria-live'), atomic: node.getAttribute('aria-atomic') }));
                state.assistiveLoading = loadingEvidence;
                assert(/opening google sign-in/i.test(loadingEvidence.text || '') && loadingEvidence.role === 'status' && loadingEvidence.live === 'polite' && loadingEvidence.atomic === 'true', name + ' assistive loading announcement');
                await page.close();
              }

              const error = await newPage({ viewport: { width: 390, height: 844 } });
              await error.goto(base + '/login?error=sign-in');
              await error.waitForSelector('[role=alert]');
              const errorState = await shot(error, '04-oauth-error-mobile-390', 'oauth-error-local-only');
              assert(/could not complete sign-in/i.test(errorState.text), 'safe OAuth error message');
              assert(await error.locator('[role=alert]').evaluate(node => document.activeElement === node), 'error focus');
              const errorAnnouncement = await error.locator('[role=alert]').evaluate(node => ({ role: node.getAttribute('role'), live: node.getAttribute('aria-live'), atomic: node.getAttribute('aria-atomic'), focused: document.activeElement === node }));
              errorState.assistiveError = errorAnnouncement;
              assert(errorAnnouncement.role === 'alert' && errorAnnouncement.live === 'assertive' && errorAnnouncement.atomic === 'true' && errorAnnouncement.focused, 'assistive OAuth error announcement and focus return');
              assert(errorState.geometry.scrollWidth <= errorState.geometry.clientWidth, 'error overflow');
              await error.close();

              const denied = await newPage({ viewport: { width: 390, height: 844 } });
              await denied.goto(base + '/service/spartan-incubator', { waitUntil: 'domcontentloaded' });
              const deniedState = await shot(denied, '05-unauthenticated-deep-link-denied', 'unauthenticated-denied');
              assert(/\/login\?next=/.test(deniedState.url), 'unauthenticated deep link redirected');
              assert(!/Spartan Incubator Service/i.test(deniedState.text), 'private dashboard not disclosed');
              await denied.close();

              const addOnFailure = await newPage({ viewport: { width: 390, height: 844 } });
              addOnFailure.__expectedFailedResource = '/utampa-live.v1.js';
              await addOnFailure.route('**/utampa-live.v1.js', route => route.abort());
              await addOnFailure.goto(base + '/login', { waitUntil: 'domcontentloaded' });
              await Promise.all([addOnFailure.waitForURL(base + '/'), addOnFailure.locator('[data-testid=google-sign-in]').click()]);
              await addOnFailure.waitForSelector('.prepareHeader', { state: 'attached' });
              assert(await addOnFailure.title() === 'My Work', 'standalone authenticated shell has the neutral My Work title');
              assert(await addOnFailure.locator('.prepareHeader').isHidden() && await addOnFailure.locator('.prepareHeader').isDisabled(), 'Prepare Me fails closed when the live add-on does not load');
              assert(await addOnFailure.locator('.globalRecord').isHidden() && await addOnFailure.locator('.globalRecord').isDisabled(), 'recording remains hidden and disabled when the live add-on does not load');
              assert(!/Connected university source|Approve \+ continue|Answer Belly|Pinchers|Suncoast/.test(await addOnFailure.locator('body').innerText()), 'standalone shell contains no legacy operational claims');
              await addOnFailure.close();

              const configuredRoute = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(configuredRoute);
              await login(configuredRoute, '/', configuredBase);
              await configuredRoute.waitForSelector('.ut-section-view[data-page="Today"] .ut-section-item');
              const configuredApi = await configuredRoute.evaluate(async () => { const response = await fetch('/api/sections/today'); return { status: response.status, body: await response.json() }; });
              assert(configuredApi.status === 200 && configuredApi.body.feedId === 'feed:browser-real-route' && configuredApi.body.section.completeness.status === 'complete', 'configured feed passes through the real authenticated server route');
              assert(/Configured server route item/.test(await configuredRoute.locator('.ut-section-view[data-page="Today"]').innerText()), 'configured server feed renders without a browser section-route mock');
              await configuredRoute.close();

              for (const [name, width, height] of [['06-dashboard-desktop-1440',1440,1000],['07-dashboard-mobile-390',390,844],['08-dashboard-mobile-375',375,812],['08b-dashboard-mobile-320',320,568],['08c-dashboard-landscape-844',844,390]]) {
                const page = await newPage({ viewport: { width, height } });
                await routeAuthorizedSources(page);
                await login(page);
                await page.waitForSelector('.ut-source-status[data-page="Today"]');
                await page.waitForSelector('.ut-unavailable-view[data-page="Today"]');
                await page.waitForSelector('.ut-live-countdown[data-state="ready"]');
                const state = await shot(page, name, 'authenticated-synthetic-oidc');
                assert(state.title === 'My Work', name + ' neutral authenticated document title');
                assert(state.geometry.scrollWidth <= state.geometry.clientWidth, name + ' overflow');
                const bos = page.locator('[data-cc-workspace="bos"]');
                assert(await bos.getAttribute('aria-disabled') === 'true', name + ' BOS disabled');
                assert(/not deployed/i.test(await bos.getAttribute('title') || ''), name + ' BOS pending title');
                const switcherFocus = await keyboardFocusEvidence(page, '[data-cc-workspace="bos"]');
                state.switcherKeyboardFocus = switcherFocus;
                assert(switcherFocus.reached && switcherFocus.outlineStyle !== 'none' && parseFloat(switcherFocus.outlineWidth) >= 2, name + ' visible switcher keyboard focus');
                if (name === '07-dashboard-mobile-390') {
                  await page.screenshot({ path: 'evidence/15-dashboard-switcher-keyboard-focus-mobile-390.png', fullPage: true });
                  evidence.screenshots.push('15-dashboard-switcher-keyboard-focus-mobile-390.png');
                }
                const bodyText = await page.locator('body').innerText();
                state.truthfulWorkspace = /Today needs a verified work-item source/.test(bodyText) && /SOURCE NOT CONNECTED/.test(bodyText);
                assert(state.truthfulWorkspace, name + ' Today fails closed without an approved work-item feed');
                assert(!/Prepare class, unblock the Incubator|4 NEED BERT|Teaching 42%/.test(bodyText), name + ' synthetic priorities and metrics hidden');
                assert(await page.locator('.sectionTabs button em:visible').count() === 0, name + ' fixed section badges hidden');
                if (name === '06-dashboard-desktop-1440') {
                  const unconfiguredShape = await page.evaluate(async () => (await fetch('/api/sections/today')).json());
                  assert(unconfiguredShape.section.asOf === null && unconfiguredShape.section.staleAfter === null && unconfiguredShape.section.freshness === 'unknown' && unconfiguredShape.section.completeness.expectedCount === null && unconfiguredShape.section.completeness.receivedCount === null, 'unconfigured section preserves unknown versus verified-zero semantics');
                }
                assert(/ENT 330 · Venture Validation/.test(await page.locator('.ut-live-countdown').getAttribute('aria-label') || ''), name + ' live next-event countdown');
                assert(!/MINUTES TO NEXT/.test(bodyText), name + ' fabricated static countdown hidden');
                await page.close();
              }

              const recorder = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(recorder);
              await login(recorder);
              await recorder.waitForSelector('.ut-live-countdown[data-state="ready"]');
              assert(await recorder.locator('.globalRecord').isHidden(), 'unsupported recording control is not presented as operational');
              assert(await recorder.locator('.globalRecord').isDisabled(), 'unsupported recording control is disabled');
              assert(await recorder.locator('#cc-recorder.is-open').count() === 0, 'recording preview is not opened');
              await recorder.close();

              const failSafe = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(failSafe);
              await login(failSafe);
              const response = await failSafe.goto(base + '/boss/', { waitUntil: 'domcontentloaded' });
              const failState = await shot(failSafe, '09-bos-direct-link-fail-safe-404', 'authenticated-sibling-denied');
              assert(response.status() === 404 && /not found/i.test(failState.text), 'BOS direct route fail safe');
              await failSafe.close();

              const replay = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(replay);
              await login(replay);
              const oldCookie = (await replay.context().cookies()).find(cookie => cookie.name === 'utampa_session');
              assert(Boolean(oldCookie), 'session cookie exists before logout');
              await replay.evaluate(async () => { await fetch('/logout', { method: 'POST' }); });
              await replay.context().addCookies([oldCookie]);
              await replay.goto(base + '/', { waitUntil: 'domcontentloaded' });
              const replayState = await shot(replay, '10-logout-replay-denied', 'logged-out-replay-denied');
              assert(/\/login\?next=/.test(replayState.url), 'revoked session replay redirected');
              assert(!/Spartan Incubator Service/i.test(replayState.text), 'revoked session disclosed no dashboard');
              await replay.close();

              const actions = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(actions);
              await login(actions);
              await actions.waitForSelector('.ut-unavailable-view[data-page="Today"]');
              assert(await actions.locator('.todayTask:visible').count() === 0, 'unverified Today tasks are not actionable');
              await actions.waitForSelector('.ut-source-status .ut-mobile-actions-center');
              await actions.locator('.ut-source-status .ut-mobile-actions-center').click();
              await actions.waitForSelector('.ut-live-drawer');
              const actionState = await shot(actions, '11-action-center-empty', 'authenticated-no-local-actions');
              assert(/No saved actions/.test(await actions.locator('.ut-live-drawer').innerText()), 'Action Center does not invent work-item history');
              await actions.locator('.ut-live-drawer .drawerClose').click();
              await actions.close();

              const service = await newPage({ viewport: { width: 844, height: 390 } });
              const serviceEvents = Array.from({ length: 9 }, (_, index) => ({
                id: 'event-service-' + index,
                title: 'Spartan Incubator Calendar title match ' + (index + 1),
                start: new Date(Date.now() + (index + 2) * 60 * 60 * 1000).toISOString(),
                end: new Date(Date.now() + (index + 3) * 60 * 60 * 1000).toISOString(),
                calendar: 'UTampa Outlook test feed',
                url: 'https://calendar.google.com/calendar/event?eid=service-' + index,
                allDay: false
              }));
              await routeAuthorizedSources(service, { events: serviceEvents, files: [{ id: 'file-service', name: 'Spartan Incubator mentor notes', mimeType: 'application/vnd.google-apps.document', modifiedTime: '2026-09-22T15:00:00Z', url: 'https://drive.google.com/open?id=service' }], driveTruncated: true });
              await login(service);
              await service.locator('.sectionTabs button', { hasText: 'Teaching' }).click();
              await service.waitForSelector('.ut-unavailable-view[data-page="Teaching"]');
              await service.waitForSelector('.ut-source-status[data-page="Teaching"]');
