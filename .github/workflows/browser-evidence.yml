              assert(!expiredBodyText.includes(expiryScrubFixture.literalTitle) && !expiredBodyText.includes('Pre-expiry Calendar item'), 'Calendar API 401 scrubs previously visible connected section and Calendar data');
              assert(await expiredApiSession.locator('.ut-section-item,.ut-calendar-panel').count() === 0, 'session expiry removes connected item and Calendar DOM');
              assert(await expiredApiSession.locator('.sectionTabs .ut-section-count').count() === 0 && await expiredApiSession.locator('.sectionTabs button', { hasText: 'Today' }).getAttribute('aria-label') === 'Today', 'session expiry removes trusted section counts and their accessible claims');
              const expiredStores = await expiredApiSession.evaluate(() => ({ section: localStorage.getItem('utampa-section-actions-v1'), legacy: localStorage.getItem('utampa-faculty-os-actions-v1') }));
              assert(expiredStores.section === null && expiredStores.legacy === null, 'session expiry clears opaque local section and legacy action state');
