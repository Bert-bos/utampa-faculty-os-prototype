              assert(/Static or sample program events are not shown as a fallback/.test(await unavailable.locator('.ut-service-schedule-body').innerText()), 'Calendar failure never falls back to sample Service events');
              assert(await unavailable.locator('.ut-service-schedule-body [role="alert"]').getAttribute('aria-live') === 'assertive', 'Service source failure is announced assertively');
              await unavailable.locator('.sectionTabs button', { hasText: 'Calendar' }).click();
              await unavailable.waitForFunction(() => document.body.innerText.includes('Calendar is temporarily unavailable'));
              assert(!/No events found/.test(await unavailable.locator('.ut-calendar-content').innerText()), 'Calendar failure is not rendered as empty data');
              assert(await unavailable.locator('.ut-calendar-content [role="alert"]').getAttribute('aria-atomic') === 'true', 'Calendar source failure is announced atomically');
              await unavailable.close();

              const driveReconnect = await newPage({ viewport: { width: 1440, height: 900 } });
