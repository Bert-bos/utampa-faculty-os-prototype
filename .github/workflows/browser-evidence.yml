              const truncatedState = await shot(truncated, '13c-calendar-truncated-only-state', 'authenticated-truncated-calendar');
              assert(!/No events found/.test(await truncated.locator('.ut-calendar-content').innerText()), 'truncated-only Calendar state is not clean empty');
              assert(truncatedState.geometry.scrollWidth <= truncatedState.geometry.clientWidth, 'truncated Calendar 320px overflow');
              await truncated.close();

              const reconnect = await newPage({ viewport: { width: 390, height: 844 } });
              await routeAuthorizedSources(reconnect, { calendarStatus: 409, driveStatus: 409 });
              await login(reconnect);
              await reconnect.waitForSelector('.ut-live-countdown[data-state="reauthorize"]');
              await reconnect.locator('.sectionTabs button', { hasText: 'Calendar' }).click();
              await reconnect.waitForFunction(() => document.body.innerText.includes('Reconnect Google to finish setup'));
              assert(!/No events found/.test(await reconnect.locator('.ut-calendar-content').innerText()), 'Calendar reauthorization is not rendered as empty Calendar data');
              await reconnect.close();

              const expiredApiSession = await newPage({ viewport: { width: 390, height: 844 } });
              const expiryScrubFixture = connectedSectionFixtures();
              await routeAuthorizedSources(expiredApiSession, { sections: expiryScrubFixture.sections, driveStatus: 401 });
              let calendarSessionExpired = false;
              await expiredApiSession.route('**/api/calendar', route => {
                if (calendarSessionExpired) return route.fulfill({ status: 401, contentType: 'application/json', body: JSON.stringify({ error: 'authentication_required' }) });
                const start = new Date(Date.now() + 2 * 60 * 60 * 1000).toISOString();
                const end = new Date(Date.now() + 3 * 60 * 60 * 1000).toISOString();
                return route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ events: [{ id: 'pre-expiry-event', title: 'Pre-expiry Calendar item', start, end, calendar: 'Authorized test feed', allDay: false }], source: 'Google Calendar · read-only pre-expiry fixture', partial: false, truncated: false, warnings: [] }) });
              });
              await login(expiredApiSession);
              await expiredApiSession.waitForFunction(title => document.body.innerText.includes(title), expiryScrubFixture.literalTitle);
              await expiredApiSession.evaluate(() => {
                localStorage.setItem('utampa-section-actions-v1', JSON.stringify({ 'feed:browser-contract-v1|item:opaque-alpha': { feedId: 'feed:browser-contract-v1', itemId: 'item:opaque-alpha', section: 'today', actionType: 'complete_local', target: '', updatedAt: new Date().toISOString() } }));
                localStorage.setItem('utampa-faculty-os-actions-v1', JSON.stringify({ legacy: { status: 'completed', target: '', updatedAt: new Date().toISOString() } }));
              });
              assert(await expiredApiSession.locator('.sectionTabs button', { hasText: 'Today' }).locator('.ut-section-count').innerText() === '2', 'pre-expiry connected Today count is visibly rendered');
              calendarSessionExpired = true;
