              await partial.locator('.sectionTabs button', { hasText: 'Calendar' }).click();
              await partial.waitForFunction(() => document.body.innerText.includes('No complete result available'));
              const partialState = await shot(partial, '13b-calendar-partial-source-state', 'authenticated-partial-calendar');
              partialState.partialStateVisible = /PARTIAL CALENDAR DATA/.test(await partial.locator('.ut-calendar-content').innerText());
              assert(partialState.partialStateVisible, 'Calendar never presents partial failure as clean empty state');
