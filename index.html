<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Work</title>
  <meta name="description" content="Private read-only work dashboard.">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/app-shell.v1.css">
  <link rel="stylesheet" href="/utampa-live.v1.css">
</head>
<body>
  <main class="topApp">
    <header class="appTop unifiedHeader">
      <div class="appIdentity" aria-label="My Work"><strong>My Work</strong><span>Private dashboard</span></div>
      <div class="wordSwitcher centeredSwitcher" aria-label="Workspaces">
        <button type="button" class="active">UTampa</button>
        <button type="button">BOS</button>
        <button type="button">Entrepreneurship Professor</button>
      </div>
      <div class="persistentTools">
        <button type="button" class="prepareHeader" disabled aria-hidden="true">Prepare me</button>
        <button type="button" class="globalRecord" disabled hidden aria-hidden="true" aria-label="Recording is unavailable">●</button>
        <button type="button" class="profile" aria-label="Open account"><span>Account</span></button>
      </div>
    </header>
    <nav class="sectionTabs" aria-label="My Work sections">
      <button type="button" class="active" aria-current="page"><span class="ico" aria-hidden="true">◆</span>Today</button>
      <button type="button"><span class="ico" aria-hidden="true">▣</span>Teaching</button>
      <button type="button"><span class="ico" aria-hidden="true">◇</span>Research</button>
      <button type="button"><span class="ico" aria-hidden="true">◎</span>Service</button>
      <button type="button"><span class="ico" aria-hidden="true">◉</span>People</button>
      <button type="button"><span class="ico" aria-hidden="true">▦</span>Calendar</button>
    </nav>
    <section class="topShell compactShell" aria-label="Active workspace"></section>
  </main>
  <script>window.__UTAMPA_APP_COMMITTED__=true;</script>
  <script src="/utampa-live.v1.js" defer></script>
  <script src="/cc-workspace-switcher.v2.js" defer></script>
</body>
</html>
